name: Android Build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - name: Set up GraalVM JDK 17 (22.1.0.1-Final)
        uses: graalvm/setup-graalvm@v1
        with:
          version: '22.1.0.1'     # Use the base version string;
          java-version: '17'      # Optional: Specify the Java version
          distribution: 'graalvm' # Use 'graalvm for community, 'graalvm-ee' for Enterprise
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify setup
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo: "JAVA_HOME: $JAVA_HOME"
          java --version
          javac -version
          native-image --version
